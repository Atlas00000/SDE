[project]
name = "orbvwap-ai"
version = "1.23.0"
description = "ORBVWAP offline AI training and replay pipeline"
readme = "Diagnostics/ai/README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "pyarrow>=14.0",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
